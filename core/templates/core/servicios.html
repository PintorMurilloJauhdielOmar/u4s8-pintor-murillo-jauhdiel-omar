<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicios</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 500px;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f0f4f8;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>Servicios</h1>

    <table>
        <thead>
            <tr>
                <th>Servicio</th>
                <th>Precio</th>
            </tr>
        </thead>
        <tbody>
            <!-- El bucle DEBE envolver las filas de la tabla -->
            {% for servicio in servicios %}
            <tr>
                <td>{{ servicio.nombre }}</td>
                <td>${{ servicio.precio }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2">No hay servicios disponibles.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
